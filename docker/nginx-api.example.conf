# Hostinger VPS — Nginx + HTTPS para a API LanceX
# 1) sudo apt install nginx certbot python3-certbot-nginx
# 2) sudo cp docker/nginx-api.example.conf /etc/nginx/sites-available/lancex-api
# 3) Troque api.seudominio.com
# 4) sudo ln -s /etc/nginx/sites-available/lancex-api /etc/nginx/sites-enabled/
# 5) sudo nginx -t && sudo systemctl reload nginx
# 6) sudo certbot --nginx -d api.seudominio.com

server {
    listen 80;
    server_name api.seudominio.com;

    location / {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
}
